plugins {
	id 'multiloader-common'
	id 'net.neoforged.moddev'
}

neoForge {
	neoFormVersion = neo_form_version
	accessTransformers.from('src/main/resources/META-INF/accesstransformer.cfg')
}

dependencies {
	compileOnly 'net.fabricmc:sponge-mixin:0.17.4+mixin.0.8.7'
	compileOnly("net.fabricmc:fabric-loader:${loader_version}") { transitive = false }
	compileOnly("me.shedaniel:RoughlyEnoughItems-api:${rei_version}")
	compileOnly("me.shedaniel:RoughlyEnoughItems-default-plugin:${rei_version}")
	compileOnly("me.shedaniel.cloth:basic-math:0.6.1")
	compileOnly("maven.modrinth:iris:${iris_version}")
	compileOnly("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
}

tasks.named('jar') {
	enabled = false
}

tasks.named('sourcesJar') {
	enabled = false
}

configurations {
	commonJava {
		canBeResolved = false
		canBeConsumed = true
	}
	commonResources {
		canBeResolved = false
		canBeConsumed = true
	}
}

artifacts {
	commonJava file('src/main/java')
	commonResources file('src/main/resources')
}
