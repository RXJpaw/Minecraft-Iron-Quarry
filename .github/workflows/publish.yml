name: publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0+26.1.2)'
        required: true
      dry_run:
        description: 'Dry run (no upload)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || github.ref }}
          sparse-checkout: |
            publish.gradle
            gradlew
            gradle/wrapper/
          sparse-checkout-cone-mode: false

      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${TAG#v}"
          RELEASE_DIR="$RUNNER_TEMP/release"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.jar' --dir "$RELEASE_DIR"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RELEASE_DIR/changelog.md"
          {
            echo "MOD_VERSION=${VERSION%%+*}"
            echo "MINECRAFT_VERSION=${VERSION#*+}"
            echo "RELEASE_DIR=$RELEASE_DIR"
          } >> "$GITHUB_ENV"

      - run: |
          echo "rootProject.buildFileName = 'publish.gradle'" > settings.gradle
          ./gradlew publishMods
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          MODRINTH_PROJECT: 'Gl72RCiC'
          CURSEFORGE_PROJECT: '1802749'
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
