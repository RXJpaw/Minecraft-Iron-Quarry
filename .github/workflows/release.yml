name: release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - run: ./gradlew build

      - run: |
          TAG="${GITHUB_REF_NAME#v}"
          echo "VERSION=${TAG%%+*}" >> "$GITHUB_ENV"
          echo "MINECRAFT=${TAG#*+}" >> "$GITHUB_ENV"

      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            fabric/build/libs/Iron-Quarry-${{ env.VERSION }}-fabric-${{ env.MINECRAFT }}.jar
            neoforge/build/libs/Iron-Quarry-${{ env.VERSION }}-neoforge-${{ env.MINECRAFT }}.jar
