plugins {
	id 'multiloader-loader'
	id 'net.neoforged.moddev'
}

neoForge {
	version = neoforge_version
	accessTransformers.from(project(':common').file('src/main/resources/META-INF/accesstransformer.cfg'))

	runs {
		configureEach {
			systemProperty 'neoforge.warnings.onlyin.hide', 'true'
		}
		client {
			client()
			ideName = 'neoforge - Client'
			gameDirectory = project.file('../run/neoforge-client')
		}
		server {
			server()
			programArgument '--nogui'
			ideName = 'neoforge - Server'
			gameDirectory = project.file('../run/neoforge-server')
		}
	}

	mods {
		iron_quarry {
			sourceSet sourceSets.main
		}
	}
}

configurations {
	localRuntime
	runtimeClasspath.extendsFrom localRuntime
}

dependencies {
	compileOnly("net.fabricmc:fabric-loader:${loader_version}") { transitive = false }

	compileOnly("me.shedaniel:RoughlyEnoughItems-neoforge:${rei_version}")
	compileOnly("me.shedaniel.cloth:basic-math:0.6.1")
	compileOnly("maven.modrinth:iris:${iris_neoforge_version}")
	compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")
	localRuntime("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")
}
