plugins {
	id 'multiloader-loader'
	id 'net.neoforged.moddev'
}

neoForge {
	version = neoforge_version
	accessTransformers.from(project(':common').file('src/main/resources/META-INF/accesstransformer.cfg'))

	runs {
		client {
			client()
			gameDirectory = project.file('../run/neoforge-client')
			disableIdeRun()
		}
		server {
			server()
			gameDirectory = project.file('../run/neoforge-server')
			disableIdeRun()
		}
	}

	mods {
		iron_quarry {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	compileOnly("net.fabricmc:fabric-loader:${loader_version}") { transitive = false }
}
